# ─────────────────────────────────────────────────────────────────────────
# Atlanta Food Story — Netlify deploy config
# ─────────────────────────────────────────────────────────────────────────
# build_dist.py copies story/, the GeoJSON files the story actually
# references, data/analysis_findings.json, and writes config.json with the
# Mapbox public token (read from MAPBOX_PUBLIC_KEY env var on Netlify; falls
# back to .env locally).  No external build tools required — pure Python stdlib.

[build]
  command = "python scripts/build_dist.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.12"

# ── Aggressive cache for static assets (busted by re-deploy) ─────────────
[[headers]]
  for = "/geojson/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=3600"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/config.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Root URL → /story/ (a small redirect so the QR can point at the bare domain)
[[redirects]]
  from   = "/"
  to     = "/story/"
  status = 302
  force  = false
